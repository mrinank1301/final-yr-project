services:
  frontend:
    build:
      context: ./frontend/project
      dockerfile: Dockerfile
      args:
        # Set to your public URL (e.g. https://yourdomain.com) for API calls from browser
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-}
        NEXT_PUBLIC_PYTHON_API_URL: ${PUBLIC_URL:-}
    image: final-yr-project-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  node:
    build:
      context: ./backend/node server
      dockerfile: Dockerfile
    image: final-yr-project-node
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_URL=${LIVEKIT_URL}

  python:
    build:
      context: ./backend/python server
      dockerfile: Dockerfile
    image: final-yr-project-python
    restart: unless-stopped
    environment:
      - PORT=5000
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY:-}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-eastasia}
      - GROQ_API_KEY=${GROQ_API_KEY:-}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - node
      - python
