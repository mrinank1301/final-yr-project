services:
  frontend:
    build:
      context: ./frontend/project
      dockerfile: Dockerfile
      args:
        # Set to your public URL (e.g. https://yourdomain.com) for API calls from browser
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-}
        NEXT_PUBLIC_PYTHON_API_URL: ${PUBLIC_URL:-}
    image: final-yr-project-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  node:
    build:
      context: ./backend/node server
      dockerfile: Dockerfile
    image: final-yr-project-node
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_URL=${LIVEKIT_URL}

  python:
    build:
      context: ./backend/python server
      dockerfile: Dockerfile
    image: final-yr-project-python
    restart: unless-stopped
    environment:
      - PORT=5000
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY:-}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-eastasia}
      - GROQ_API_KEY=${GROQ_API_KEY:-}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend
      - node
      - python
      - livekit

  # Self-hosted LiveKit: normal container so nginx can reach livekit:7880 (no gateway)
  # Small UDP range (101 ports) to avoid docker-proxy errors on some VMs
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
        keys:
           ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
    command: --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "50000-50100:50000-50100/udp"
