# LiveKit Server Configuration - Production
# Docs: https://docs.livekit.io/realtime/self-hosting/deployment/

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  # use_external_ip queries a STUN server to discover the public IP
  use_external_ip: true
  enable_loopback_candidate: false

# API keys - injected via environment variables in docker-compose
# keys:
#   LIVEKIT_API_KEY: LIVEKIT_API_SECRET

turn:
  enabled: true
  domain: LIVEKIT_DOMAIN_PLACEHOLDER
  tls_port: 5349
  udp_port: 3478
  external_tls: true

logging:
  level: info
  pion_level: warn

room:
  empty_timeout: 300
  max_participants: 50

webhook: {}
